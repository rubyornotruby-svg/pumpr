<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pumpr · Admin</title>
<link rel="stylesheet" href="../assets/fonts.css">
<link rel="stylesheet" href="../assets/pumpr.css">
<style>
body{margin:0;background:var(--pz-bg);color:var(--pz-text);font:500 15px/1.55 var(--pz-body);-webkit-font-smoothing:antialiased}
.bgx{position:fixed;inset:0;pointer-events:none;background:radial-gradient(40% 35% at 85% 0%,rgba(139,92,246,.18),transparent 70%),radial-gradient(35% 30% at 5% 0%,rgba(198,255,61,.08),transparent 70%)}
.shell{position:relative;width:min(1200px,100% - 32px);margin:0 auto;padding:22px 0 80px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:26px}
.top .badge{font:700 11px/1 var(--pz-mono);letter-spacing:.14em;color:var(--pz-lime);border:1px solid rgba(198,255,61,.35);padding:6px 9px;border-radius:999px}
.top .sp{flex:1}
.top .who{color:var(--pz-muted);font:600 13px/1.3 var(--pz-body)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:22px;padding:5px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--pz-line);width:max-content;max-width:100%}
.tabs button{appearance:none;border:0;background:none;color:var(--pz-muted);font:700 14px/1 var(--pz-body);padding:11px 16px;border-radius:11px;cursor:pointer;transition:background .2s,color .2s;display:inline-flex;gap:8px;align-items:center}
.tabs button:hover{color:var(--pz-text)}
.tabs button[aria-selected="true"]{background:var(--pz-lime);color:var(--pz-lime-ink)}
.tabs small{font:700 10px/1 var(--pz-mono);letter-spacing:.08em;opacity:.7}
.panel{display:none;animation:in .45s var(--pz-ease)}
.panel.on{display:grid;gap:18px}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h1{font:800 28px/1.1 var(--pz-display);letter-spacing:-.02em;margin:0}
h2{font:700 18px/1.2 var(--pz-display);margin:0}
.sub{color:var(--pz-muted);margin:6px 0 0}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media(max-width:900px){.kpis{grid-template-columns:1fr 1fr}}
.kpi{padding:20px}
.kpi span{color:var(--pz-muted);font:600 13px/1.3 var(--pz-body)}
.kpi b{display:block;font:800 34px/1.1 var(--pz-display);margin-top:10px;letter-spacing:-.02em}
.kpi small{color:var(--pz-dim);font:600 12px/1.3 var(--pz-body)}
.box{padding:22px}
.box-h{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.tools .pz-field{width:auto;min-width:220px;padding:10px 13px;font-size:14px}
.add{display:grid;grid-template-columns:1.4fr 1fr auto;gap:10px;align-items:end}
@media(max-width:700px){.add{grid-template-columns:1fr}}
.tbl-wrap{overflow-x:auto;border:1px solid var(--pz-line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{text-align:left;font:700 12px/1 var(--pz-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--pz-dim);padding:13px 14px;border-bottom:1px solid var(--pz-line);background:rgba(255,255,255,.02)}
td{padding:12px 14px;border-bottom:1px solid var(--pz-line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .15s}
tbody tr:hover{background:rgba(255,255,255,.025)}
.mail{font-weight:700;word-break:break-all}
.st{display:inline-flex;align-items:center;gap:6px;font:700 12px/1 var(--pz-body);padding:6px 9px;border-radius:999px}
.st.on{background:rgba(63,224,162,.12);color:var(--pz-up)}
.st.off{background:rgba(255,93,115,.12);color:#ff9aa9}
.st.wait{background:rgba(255,255,255,.06);color:var(--pz-muted)}
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:34px;text-align:center;color:var(--pz-muted)}
.empty b{display:block;color:var(--pz-text);font:700 16px/1.3 var(--pz-display);margin-bottom:6px}
.form{display:grid;gap:16px;max-width:620px}
.line{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 16px;border:1px solid var(--pz-line);border-radius:12px}
.line span{font-weight:700}
.line small{display:block;color:var(--pz-muted);font-weight:500}
.switch{appearance:none;width:46px;height:27px;border-radius:999px;background:rgba(255,255,255,.12);position:relative;cursor:pointer;transition:background .25s;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .3s var(--pz-ease)}
.switch:checked{background:var(--pz-lime)}
.switch:checked:after{transform:translateX(19px);background:var(--pz-lime-ink)}
.recent{display:grid;gap:8px}
.recent div{display:flex;justify-content:space-between;gap:12px;padding:11px 14px;border:1px solid var(--pz-line);border-radius:12px;font-size:14px}
.recent em{font-style:normal;color:var(--pz-muted);font-size:13px;white-space:nowrap}
.login{display:grid;place-items:center;min-height:70vh}
.login .pz-card{width:min(420px,100%);padding:30px;background:var(--pz-panel2)}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:18px}
@media(max-width:900px){.cols{grid-template-columns:1fr}}
.steps-todo{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.steps-todo li{display:flex;gap:10px;align-items:flex-start;color:#c6cce0;font-size:14px}
.steps-todo li i{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font:700 11px/1 var(--pz-mono);font-style:normal;background:rgba(255,255,255,.06);color:var(--pz-muted);margin-top:1px}
.steps-todo li.ok i{background:rgba(63,224,162,.15);color:var(--pz-up)}
</style>
</head>
<body class="pz">
<div class="bgx" aria-hidden="true"></div>
<div class="shell">
  <header class="top">
    <a class="pz-logo" href="../"><i>P</i>Pumpr</a><span class="badge">ADMIN</span><span class="sp"></span>
    <span class="who" id="who"></span>
    <a class="pz-btn pz-btn-sm" href="../">Site de vente</a><a class="pz-btn pz-btn-sm pz-btn-main" href="../desk/">Ouvrir le desk</a>
    <button class="pz-btn pz-btn-sm" type="button" id="outBtn" hidden>Se déconnecter</button>
  </header>
  <main id="app"><div class="login"><div class="g-loading" style="color:var(--pz-muted)">Chargement…</div></div></main>
</div>
<div class="pz-toast" id="toast" role="status"></div>

<script src="../config.js"></script>
<script src="../assets/pumpr.js"></script>
<script>
(()=>{
"use strict";
const P=window.Pumpr,A=P.admin;
const $=s=>document.querySelector(s),$$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dt=v=>v?new Intl.DateTimeFormat("fr-FR",{dateStyle:"medium",timeStyle:"short"}).format(new Date(v)):"—";
const ago=v=>{if(!v)return"jamais";const m=(Date.now()-new Date(v))/60000;if(m<2)return"à l'instant";if(m<60)return Math.round(m)+" min";const h=m/60;if(h<24)return Math.round(h)+" h";return Math.round(h/24)+" j"};
let tt;const toast=m=>{const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),2600)};
const app=$("#app");
let access=[],profiles=[],site={},retracts=[],tab="dash",confirmDel=null;

if(P.mode==="demo"){const d=document.createElement("div");d.className="pz-demo";d.textContent="Mode démo : mot de passe provisoire. La vraie protection arrivera avec Supabase.";document.body.appendChild(d)}

/* ---------- connexion admin ---------- */
function loginView(msg){
  app.innerHTML=`<div class="login"><div class="pz-card"><h1 style="font-size:24px">Espace admin</h1><p class="sub" style="margin-bottom:20px">Réservé aux administrateurs de Pumpr.</p>
  <form class="form" id="lf" novalidate><label class="pz-label">E-mail<input class="pz-field" id="lm" type="email" autocomplete="email"></label>
  <label class="pz-label">Mot de passe<input class="pz-field" id="lp" type="password" autocomplete="current-password"></label>
  <div class="pz-err" id="le" role="alert">${esc(msg||"")}</div><button class="pz-btn pz-btn-main" type="submit" id="lg">Se connecter</button></form></div></div>`;
  $("#lf").addEventListener("submit",async e=>{e.preventDefault();const b=$("#lg");b.disabled=true;const r=await P.signIn($("#lm").value,$("#lp").value);b.disabled=false;if(!r.ok){$("#le").textContent=r.error;return}boot()});
}

/* ---------- données ---------- */
async function load(){[access,profiles,site,retracts]=await Promise.all([A.listAccess(),A.listProfiles(),P.site(),A.listWithdrawals()])}
const profOf=e=>profiles.find(p=>P.norm(p.email)===e);

/* ---------- rendu ---------- */
function shell(){
  app.innerHTML=`<div class="tabs" role="tablist">
    <button role="tab" data-t="dash">Tableau de bord</button>
    <button role="tab" data-t="access">Acheteurs et accès <small>VENTE</small></button>
    <button role="tab" data-t="site">Site de vente <small>VENTE</small></button>
    <button role="tab" data-t="users">Utilisateurs <small>DESK</small></button>
    <button role="tab" data-t="retract">Rétractations <small id="rCount"></small></button>
  </div>
  <section class="panel" id="p-dash"></section><section class="panel" id="p-access"></section><section class="panel" id="p-site"></section><section class="panel" id="p-users"></section><section class="panel" id="p-retract"></section>`;
  $$(".tabs button").forEach(b=>b.addEventListener("click",()=>show(b.dataset.t)));
  show(tab);
}
function show(t){tab=t;try{history.replaceState(null,"","#"+t)}catch(e){}$$(".tabs button").forEach(b=>b.setAttribute("aria-selected",String(b.dataset.t===t)));$$(".panel").forEach(p=>p.classList.toggle("on",p.id==="p-"+t));({dash,access:accessP,site:siteP,users,retract})[t]()}

function dash(){
  const act=access.filter(a=>a.actif).length,acc=profiles.length,conf=profiles.filter(p=>p.configure).length,wk=profiles.filter(p=>p.derniere_connexion&&Date.now()-new Date(p.derniere_connexion)<7*864e5).length;
  const recent=profiles.filter(p=>p.derniere_connexion).sort((a,b)=>String(b.derniere_connexion).localeCompare(String(a.derniere_connexion))).slice(0,6);
  const salesOk=site.ventes_ouvertes&&site.lien_achat;
  $("#p-dash").innerHTML=`<div><h1>Tableau de bord</h1><p class="sub">Vue d'ensemble des ventes et du desk.</p></div>
  <div class="kpis">
    <div class="pz-card kpi"><span>Accès actifs</span><b>${act}</b><small>${access.length-act} retiré(s)</small></div>
    <div class="pz-card kpi"><span>Comptes créés</span><b>${acc}</b><small>sur ${act} accès</small></div>
    <div class="pz-card kpi"><span>Desks configurés</span><b>${conf}</b><small>${acc-conf} à configurer</small></div>
    <div class="pz-card kpi"><span>Actifs sur 7 jours</span><b>${wk}</b><small>dernière connexion</small></div>
  </div>
  <div class="cols">
    <div class="pz-card box"><div class="box-h"><h2>Dernières connexions</h2></div>${recent.length?`<div class="recent">${recent.map(p=>`<div><span class="mail">${esc(p.nom||p.email)}</span><em>il y a ${ago(p.derniere_connexion)}</em></div>`).join("")}</div>`:`<div class="empty"><b>Aucune connexion</b>Les utilisateurs apparaîtront ici.</div>`}</div>
    <div class="pz-card box"><div class="box-h"><h2>Mise en route</h2></div><ul class="steps-todo">
      <li class="${P.mode==="live"?"ok":""}"><i>${P.mode==="live"?"✓":"1"}</i>Brancher Supabase (comptes sécurisés)</li>
      <li class="${site.lien_achat?"ok":""}"><i>${site.lien_achat?"✓":"2"}</i>Ajouter le lien d'achat (Lemon Squeezy ou Stripe)</li>
      <li class="${site.prix?"ok":""}"><i>${site.prix?"✓":"3"}</i>Afficher le prix</li>
      <li class="${salesOk?"ok":""}"><i>${salesOk?"✓":"4"}</i>Ouvrir les ventes</li>
    </ul></div>
  </div>`;
}

function accessP(){
  const q=($("#aq")&&$("#aq").value)||"";
  $("#p-access").innerHTML=`<div><h1>Acheteurs et accès</h1><p class="sub">Seuls les e-mails de cette liste peuvent créer un compte et ouvrir le desk. Tu peux ajouter un accès à la main (cadeau, test, paiement reçu autrement).</p></div>
  <div class="pz-card box"><form class="add" id="addF" novalidate>
    <label class="pz-label">E-mail de l'acheteur<input class="pz-field" id="addM" type="email" placeholder="client@exemple.com"></label>
    <label class="pz-label">Note (facultatif)<input class="pz-field" id="addN" maxlength="120" placeholder="Ex. commande n° 1024"></label>
    <button class="pz-btn pz-btn-main" type="submit">Donner l'accès</button>
  </form><div class="pz-err" id="addE" role="alert" style="margin-top:8px"></div></div>
  <div class="pz-card box"><div class="box-h"><h2>${access.length} accès</h2><div class="tools"><input class="pz-field" id="aq" type="search" placeholder="Rechercher un e-mail…" value="${esc(q)}" aria-label="Rechercher"><button class="pz-btn pz-btn-sm" type="button" id="csv">Exporter (CSV)</button></div></div><div id="aTbl"></div></div>`;
  drawAccess();
  $("#aq").addEventListener("input",drawAccess);
  $("#addF").addEventListener("submit",async e=>{e.preventDefault();const r=await A.grant($("#addM").value,$("#addN").value,"manuel");if(!r.ok){$("#addE").textContent=r.error;return}await refresh();toast("Accès donné.");show("access")});
  $("#csv").addEventListener("click",()=>{const rows=[["email","statut","source","note","ajoute_le","compte_cree","nom"]].concat(access.map(a=>{const p=profOf(a.email);return[a.email,a.actif?"actif":"retire",a.source||"",a.note||"",a.cree_le||"",p?"oui":"non",p&&p.nom||""]}));const csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(";")).join("\n");const u=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv;charset=utf-8"}));const a=document.createElement("a");a.href=u;a.download="pumpr-acces.csv";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove()},500)});
}
function drawAccess(){
  const q=P.norm($("#aq").value),list=access.filter(a=>!q||a.email.includes(q)||String(a.note||"").toLowerCase().includes(q));
  const box=$("#aTbl");
  if(!access.length){box.innerHTML=`<div class="empty"><b>Aucun acheteur pour l'instant</b>Ajoute un e-mail ci-dessus, ou attends les premières ventes.</div>`;return}
  if(!list.length){box.innerHTML=`<div class="empty">Aucun résultat.</div>`;return}
  box.innerHTML=`<div class="tbl-wrap"><table><thead><tr><th>E-mail</th><th>Statut</th><th>Compte</th><th>Source</th><th>Ajouté le</th><th></th></tr></thead><tbody>${list.map(a=>{const p=profOf(a.email),c=confirmDel===a.email;return`<tr><td><div class="mail">${esc(a.email)}</div>${a.note?`<small class="pz-note">${esc(a.note)}</small>`:""}</td><td>${a.actif?'<span class="st on">Actif</span>':'<span class="st off">Retiré</span>'}</td><td>${p?(p.configure?'<span class="st on">Configuré</span>':'<span class="st wait">Créé</span>'):'<span class="st wait">Pas encore</span>'}</td><td>${esc(a.source||"manuel")}</td><td>${dt(a.cree_le)}</td><td><div class="acts">${c?`<button class="pz-btn pz-btn-sm pz-btn-danger" data-del="${esc(a.email)}">Confirmer la suppression</button><button class="pz-btn pz-btn-sm" data-no>Annuler</button>`:`<button class="pz-btn pz-btn-sm" data-tog="${esc(a.email)}" data-on="${a.actif?0:1}">${a.actif?"Retirer l'accès":"Réactiver"}</button><button class="pz-btn pz-btn-sm pz-btn-danger" data-ask="${esc(a.email)}" aria-label="Supprimer">Supprimer</button>`}</div></td></tr>`}).join("")}</tbody></table></div>`;
  box.onclick=async e=>{const b=e.target.closest("button");if(!b)return;
    if(b.dataset.tog){const r=await A.setActive(b.dataset.tog,b.dataset.on==="1");if(!r.ok)return toast(r.error);await refresh();drawAccess();toast(b.dataset.on==="1"?"Accès réactivé.":"Accès retiré.")}
    else if(b.dataset.ask){confirmDel=b.dataset.ask;drawAccess()}
    else if(b.hasAttribute("data-no")){confirmDel=null;drawAccess()}
    else if(b.dataset.del){const r=await A.remove(b.dataset.del);confirmDel=null;if(!r.ok)return toast(r.error);await refresh();drawAccess();toast("Accès supprimé.")}};
}

function siteP(){
  $("#p-site").innerHTML=`<div><h1>Site de vente</h1><p class="sub">Ces réglages s'affichent tout de suite sur le site de vente, sans toucher au code.</p></div>
  <div class="pz-card box"><form class="form" id="sf" novalidate>
    <label class="pz-label">Prix affiché<input class="pz-field" id="sPrix" maxlength="40" placeholder="Ex. 29 €" value="${esc(site.prix)}"></label>
    <label class="pz-label">Lien d'achat (page de paiement Lemon Squeezy ou Stripe)<input class="pz-field" id="sLien" type="url" placeholder="https://…" value="${esc(site.lien_achat)}"></label>
    <label class="pz-label">Bandeau d'annonce en haut du site (facultatif)<input class="pz-field" id="sAnn" maxlength="160" placeholder="Ex. Prix de lancement jusqu'à dimanche" value="${esc(site.annonce)}"></label>
    <label class="line"><div><span>Ventes ouvertes</span><small>Désactivé : le bouton « Acheter » affiche « Les ventes ouvrent bientôt ».</small></div><input type="checkbox" class="switch" id="sOpen" ${site.ventes_ouvertes?"checked":""}></label>
    <div class="pz-err" id="sErr" role="alert"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="pz-btn pz-btn-main" type="submit">Enregistrer</button><a class="pz-btn" href="../" target="_blank" rel="noopener">Voir le site ↗</a></div>
  </form></div>`;
  $("#sf").addEventListener("submit",async e=>{e.preventDefault();const v={prix:$("#sPrix").value.trim(),lien_achat:$("#sLien").value.trim(),annonce:$("#sAnn").value.trim(),ventes_ouvertes:$("#sOpen").checked};
    if(v.ventes_ouvertes&&!v.lien_achat){$("#sErr").textContent="Ajoute d'abord le lien d'achat pour ouvrir les ventes.";return}
    const r=await A.saveSite(v);if(!r.ok){$("#sErr").textContent=r.error;return}$("#sErr").textContent="";site=Object.assign(site,v);toast("Site de vente mis à jour.")});
}

function users(){
  const list=profiles.slice().sort((a,b)=>String(b.derniere_connexion||"").localeCompare(String(a.derniere_connexion||"")));
  $("#p-users").innerHTML=`<div><h1>Utilisateurs du desk</h1><p class="sub">Les comptes créés et leur configuration. Le journal de trades de chaque utilisateur reste privé dans son navigateur.</p></div>
  <div class="pz-card box"><div class="box-h"><h2>${list.length} compte${list.length>1?"s":""}</h2></div>${list.length?`<div class="tbl-wrap"><table><thead><tr><th>Utilisateur</th><th>Niveau</th><th>Marchés</th><th>Risque</th><th>Desk</th><th>Dernière connexion</th></tr></thead><tbody>${list.map(p=>{const c=p.config||{},a=access.find(x=>x.email===P.norm(p.email));return`<tr><td><div class="mail">${esc(p.nom||"—")}</div><small class="pz-note">${esc(p.email)}</small>${a&&!a.actif?' <span class="st off">Accès retiré</span>':""}</td><td>${esc(c.niveau||"—")}</td><td>${esc((c.marches||[]).join(", ")||"—")}</td><td>${c.pct?esc(String(c.pct).replace(".",","))+" %":"—"}</td><td>${p.configure?'<span class="st on">Configuré</span>':'<span class="st wait">À configurer</span>'}</td><td>${p.derniere_connexion?dt(p.derniere_connexion):"—"}</td></tr>`}).join("")}</tbody></table></div>`:`<div class="empty"><b>Aucun compte pour l'instant</b>Les acheteurs apparaîtront ici après avoir créé leur compte sur le desk.</div>`}</div>
  ${P.mode==="demo"?`<div class="pz-card box"><div class="box-h"><h2>Démo</h2></div><p class="pz-note" style="margin:0 0 14px">Efface tous les comptes, accès et réglages simulés dans ce navigateur.</p><button class="pz-btn pz-btn-danger" type="button" id="reset">Réinitialiser la démo</button></div>`:""}`;
  const r=$("#reset");if(r)r.addEventListener("click",()=>{if(r.dataset.c){A.demoReset();location.reload()}else{r.dataset.c=1;r.textContent="Confirmer : tout effacer"}});
}

function retract(){
  const nb=retracts.filter(r=>r.statut==="nouvelle").length;const c=$("#rCount");if(c)c.textContent=nb?nb+" NOUV.":"";
  const lbl={nouvelle:'<span class="st wait">Nouvelle</span>',remboursee:'<span class="st on">Remboursée</span>',refusee:'<span class="st off">Refusée</span>'};
  $("#p-retract").innerHTML=`<div><h1>Demandes de rétractation</h1><p class="sub">Envoyées depuis le bouton « Se rétracter du contrat ». Rembourse depuis ton prestataire de paiement, puis note la suite ici. Pense à retirer l'accès de l'acheteur s'il est remboursé.</p></div>
  <div class="pz-card box">${retracts.length?`<div class="tbl-wrap"><table><thead><tr><th>Demande</th><th>Commande</th><th>Message</th><th>Statut</th><th></th></tr></thead><tbody>${retracts.map(r=>`<tr><td><div class="mail">${esc(r.email)}</div><small class="pz-note">${esc(r.nom||"")} · ${dt(r.cree_le)} · R-${esc(String(r.id).slice(0,8).toUpperCase())}</small></td><td>${esc(r.commande||"—")}</td><td style="max-width:280px">${esc(r.message||"—")}</td><td>${lbl[r.statut]||esc(r.statut)}</td><td><div class="acts"><button class="pz-btn pz-btn-sm" data-rs="${esc(r.id)}" data-v="remboursee">Remboursée</button><button class="pz-btn pz-btn-sm" data-rs="${esc(r.id)}" data-v="refusee">Refusée</button></div></td></tr>`).join("")}</tbody></table></div>`:`<div class="empty"><b>Aucune demande</b>Les demandes de rétractation apparaîtront ici.</div>`}</div>`;
  $("#p-retract").onclick=async e=>{const b=e.target.closest("[data-rs]");if(!b)return;const r=await A.setWithdrawal(b.dataset.rs,b.dataset.v);if(!r.ok)return toast(r.error);await refresh();retract();toast("Statut mis à jour.")};
}
async function refresh(){await load()}

function demoLock(msg){
  app.innerHTML=`<div class="login"><div class="pz-card"><h1 style="font-size:24px">Espace admin</h1><p class="sub" style="margin-bottom:20px">Entre le mot de passe administrateur.</p>
  <form class="form" id="df" novalidate><label class="pz-label">Mot de passe<input class="pz-field" id="dp" type="password" autocomplete="current-password"></label>
  <div class="pz-err" id="de" role="alert">${esc(msg||"")}</div><button class="pz-btn pz-btn-main" type="submit" id="dg">Entrer</button></form></div></div>`;
  setTimeout(()=>$("#dp").focus(),50);
  $("#df").addEventListener("submit",async e=>{e.preventDefault();const b=$("#dg");b.disabled=true;b.textContent="Vérification…";const ok=await P.unlockDemoAdmin($("#dp").value);if(ok)return boot();b.disabled=false;b.textContent="Entrer";$("#de").textContent="Mot de passe incorrect.";$("#dp").select()});
}

async function boot(){
  try{
    await P.ready();
    const s=await P.session();
    if(P.mode==="live"){
      if(!s)return loginView();
      if(!await P.isAdmin()){await P.signOut();return loginView("Ce compte n'est pas administrateur.")}
    }else if(!await P.isAdmin())return demoLock();
    $("#who").textContent=s?s.email:"Mode démo";
    const out=$("#outBtn");out.hidden=false;out.onclick=async()=>{if(P.mode==="demo")P.lockDemoAdmin();else await P.signOut();location.reload()};
    await load();
    const h=location.hash.slice(1);if(["dash","access","site","users","retract"].includes(h))tab=h;
    shell();{const nb=retracts.filter(r=>r.statut==="nouvelle").length;const c=$("#rCount");if(c)c.textContent=nb?nb+" NOUV.":""}
  }catch(e){app.innerHTML=`<div class="login"><div class="pz-card"><h1 style="font-size:22px">Erreur</h1><p class="sub">${esc(e.message||"Chargement impossible.")}</p><button class="pz-btn pz-btn-main" type="button" onclick="location.reload()">Réessayer</button></div></div>`}
}
boot();
})();
</script>
</body>
</html>
