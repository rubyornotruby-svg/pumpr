<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Pumpr a déménagé</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06070c;color:#eef0f8;font:500 16px/1.6 system-ui,sans-serif;text-align:center;padding:24px}a{color:#c6ff3d}</style></head>
<body><p>Pumpr a déménagé.<br><a id="a" href="https://pumpr.pumprdesk.workers.dev/">Continuer vers le nouveau site</a></p>
<script>
/* Les anciens liens /pumpr/… sont renvoyés vers la même page du nouveau site. */
var p=location.pathname.replace(/^\/pumpr(?=\/|$)/,"")||"/";
var u="https://pumpr.pumprdesk.workers.dev"+p+location.search+location.hash;
document.getElementById("a").href=u;location.replace(u);
</script></body></html>
