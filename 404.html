<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pumpr · Page introuvable</title>
<link rel="icon" href="/pumpr/assets/img/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/pumpr/assets/img/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/pumpr/assets/img/apple-touch-icon.png">
<meta name="theme-color" content="#06070c">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#06070c;color:#eef1f8;font:500 16px/1.6 "Manrope","Segoe UI",system-ui,sans-serif;text-align:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));box-sizing:border-box;overflow:hidden}
body::before{content:"";position:fixed;inset:-20% -10% auto;height:120vh;pointer-events:none;background:radial-gradient(40% 35% at 75% 10%,rgba(139,92,246,.28),transparent 70%),radial-gradient(35% 30% at 15% 20%,rgba(198,255,61,.14),transparent 70%)}
main{position:relative;max-width:520px}
.code{font:900 clamp(90px,22vw,170px)/1 "Unbounded","Arial Black",sans-serif;letter-spacing:-.06em;background:linear-gradient(180deg,#c6ff3d,#ff4fd8);-webkit-background-clip:text;background-clip:text;color:transparent}
.chart{display:flex;justify-content:center;align-items:flex-end;gap:8px;height:70px;margin:8px 0 18px}
.chart b{width:14px;border-radius:3px;background:#ff4fd8}
h1{font:800 26px/1.2 "Unbounded","Arial Black",sans-serif;letter-spacing:-.02em;margin:0 0 10px}
p{color:#9aa2b8;margin:0 0 26px}
.btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-flex;padding:13px 20px;border-radius:999px;font-weight:800;text-decoration:none;font-size:15px}
a.main{background:#c6ff3d;color:#0b1200}
a.alt{border:1px solid rgba(255,255,255,.18);color:#eef1f8}
a:focus-visible{outline:2px solid #c6ff3d;outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="code" aria-hidden="true">404</div>
  <div class="chart" aria-hidden="true"><b style="height:62px"></b><b style="height:50px"></b><b style="height:54px"></b><b style="height:34px"></b><b style="height:22px"></b><b style="height:10px"></b></div>
  <h1>Cette page a été liquidée.</h1>
  <p>Le lien est peut-être cassé ou la page a changé d'adresse. Ton journal, lui, est en sécurité.</p>
  <div class="btns"><a class="main" id="home" href="/pumpr/">Retour à l'accueil</a><a class="alt" id="desk" href="/pumpr/desk/">Ouvrir mon desk</a></div>
</main>
<script>
/* fonctionne aussi si le dépôt est renommé : on repart du premier dossier de l'adresse */
(function(){var seg=location.pathname.split("/").filter(Boolean)[0];var base=location.hostname.endsWith("github.io")&&seg?"/"+seg+"/":"/";document.getElementById("home").href=base;document.getElementById("desk").href=base+"desk/";})();
</script>
</body>
</html>
